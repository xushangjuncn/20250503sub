[custom]
; 1. 策略组 (自动抓取机场最新节点)
custom_proxy_group=✔️ 节点选择`select`[]♻️ 自动选择`[]DIRECT`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,5
custom_proxy_group=✳️ 专用下载`load-balance`(专用X)`http://www.gstatic.com/generate_204`300
custom_proxy_group=❇️ 电报下载`url-test`(TS)`http://www.gstatic.com/generate_204`300,,50

; 2. 置顶核心规则 (TG与国内流量精准识别)
custom_rule=PROCESS-NAME,qbittorrent-nox,✳️ 专用下载
custom_rule=DOMAIN-KEYWORD,tracker,✳️ 专用下载
custom_rule=DOMAIN-KEYWORD,torrent,✳️ 专用下载
custom_rule=GEOSITE,telegram,❇️ 电报下载
custom_rule=GEOIP,telegram,❇️ 电报下载
custom_rule=GEOIP,lan,DIRECT,no-resolve
custom_rule=GEOSITE,cn,DIRECT
custom_rule=GEOIP,cn,DIRECT

; 3. 开启规则引擎并强制覆盖模板 (解决空规则与全家桶问题)
enable_rule_generator=true
overwrite_original_rules=true

; 4. 引擎防崩溃兜底 (转换器会将 []FINAL 自动翻译为 MATCH 规则)
ruleset=✳️ 专用下载,[]FINAL
